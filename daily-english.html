<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0a0f"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="daily ENGLISH"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <title>daily ENGLISH</title>
  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      const m={name:"daily ENGLISH",short_name:"영어회화",start_url:"./",display:"standalone",
        background_color:"#0a0a0f",theme_color:"#7c6fff",orientation:"portrait",
        icons:[{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%237c6fff'/><text y='130' x='96' text-anchor='middle' font-size='100' font-family='serif'>🗣</text></svg>",sizes:"192x192",type:"image/svg+xml"}]};
      const l=document.createElement('link');l.rel='manifest';
      l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));
      document.head.appendChild(l);
    });
  </script>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%237c6fff'/><text y='125' x='90' text-anchor='middle' font-size='90' font-family='serif'>🗣</text></svg>"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;
      --accent:#7c6fff;--accent-soft:rgba(124,111,255,0.15);
      --red:#ff4646;--green:#64dc82;
      --text:#f0ede8;--muted:#888;
      --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;overflow:hidden}
    #app{height:100dvh;display:flex;flex-direction:column}
    .screen{display:none;flex-direction:column;flex:1;overflow:hidden}
    .screen.active{display:flex}

    /* HOME */
    #home{align-items:center;padding:calc(var(--safe-top)+44px) 24px calc(var(--safe-bot)+28px);gap:18px;overflow-y:auto}
    .streak-badge{background:rgba(255,160,50,.15);border:1px solid rgba(255,160,50,.3);color:#ffb347;border-radius:20px;padding:6px 16px;font-size:13px;font-weight:600}
    .logo{text-align:center;line-height:1}
    .logo-main{display:block;font-family:'Syne',sans-serif;font-size:52px;font-weight:800;letter-spacing:-2px}
    .logo-sub{display:block;font-family:'Syne',sans-serif;font-size:18px;font-weight:700;letter-spacing:10px;color:var(--accent);margin-top:-4px}
    .tagline{font-size:14px;color:var(--muted);text-align:center}
    .stats-row{display:flex;gap:10px;width:100%}
    .stat-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 6px;text-align:center}
    .stat-val{font-family:'Syne',sans-serif;font-size:19px;font-weight:700;color:var(--accent)}
    .stat-lbl{font-size:11px;color:#666;margin-top:3px}
    .primary-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:opacity .2s}
    .primary-btn:disabled{opacity:.38;cursor:not-allowed}
    .hint{font-size:12px;color:#555;text-align:center}

    /* SETUP */
    #setup{padding:calc(var(--safe-top)+20px) 22px calc(var(--safe-bot)+20px);gap:14px;overflow-y:auto}
    .back-btn{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;padding:2px 0;align-self:flex-start}
    .setup-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:800}
    .sec-label{font-size:11px;font-weight:700;color:#555;letter-spacing:1.2px;text-transform:uppercase;margin-top:6px}
    .topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .topic-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:all .15s}
    .topic-btn.sel{background:var(--accent-soft);border-color:var(--accent)}
    .topic-emoji{font-size:24px}
    .topic-label{font-size:13px;color:var(--text);font-weight:600}
    .level-row{display:flex;gap:8px}
    .level-btn{flex:1;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:11px 6px;cursor:pointer;text-align:center;transition:all .15s}
    .level-btn.sel{background:var(--accent-soft);border-color:var(--accent)}
    .level-name{font-size:13px;font-weight:700;color:var(--text)}
    .level-desc{font-size:10px;color:#666;margin-top:3px}

    /* CHAT */
    #chat{padding:0}
    .chat-header{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-top)+11px) 15px 11px;border-bottom:1px solid var(--border);background:#0d0d14;flex-shrink:0}
    .chat-title{font-size:15px;font-weight:700}
    .chat-sub{font-size:11px;color:#666;margin-top:1px}
    .hdr-right{margin-left:auto;display:flex;align-items:center;gap:7px}
    .live-tag{background:rgba(100,220,130,.13);border:1px solid rgba(100,220,130,.28);color:var(--green);font-size:10px;font-weight:700;letter-spacing:1px;border-radius:6px;padding:3px 8px}
    .icon-btn{background:none;border:1.5px solid var(--border);border-radius:8px;width:31px;height:31px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;flex-shrink:0;transition:all .2s}
    .icon-btn.on{border-color:var(--accent);background:var(--accent-soft)}
    .msg-list{flex:1;overflow-y:auto;padding:14px 13px;display:flex;flex-direction:column;gap:13px;-webkit-overflow-scrolling:touch}
    .msg-group{display:flex;flex-direction:column;gap:5px;animation:fadeUp .28s ease}
    .avatar-row{display:flex;align-items:flex-start;gap:9px}
    .avatar{width:29px;height:29px;border-radius:50%;background:linear-gradient(135deg,#7c6fff,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;flex-shrink:0;margin-top:2px}
    .bubble{background:var(--surface);border:1px solid var(--border);border-radius:4px 13px 13px 13px;padding:11px 13px;font-size:14px;line-height:1.65;color:#e8e5f0;max-width:calc(100% - 38px);white-space:pre-wrap;cursor:pointer;user-select:none}
    .bubble:active{opacity:.72}
    .replay-hint{font-size:10px;color:#3a3a4a;margin-left:38px;margin-top:2px}
    .feedback-box{background:rgba(124,111,255,.07);border:1px solid rgba(124,111,255,.18);border-radius:10px;padding:9px 13px;display:flex;gap:7px;margin-left:38px;animation:fadeUp .3s ease .08s both}
    .fb-icon{font-size:13px;flex-shrink:0;margin-top:1px}
    .fb-text{font-size:12px;color:#a89fe0;line-height:1.65;white-space:pre-wrap}
    .user-bubble-wrap{display:flex;justify-content:flex-end;animation:fadeUp .2s ease}
    .user-bubble{background:var(--accent);color:#fff;border-radius:13px 4px 13px 13px;padding:11px 13px;font-size:14px;line-height:1.6;max-width:83%}
    .typing-bubble{display:flex;gap:4px;align-items:center;padding:13px 15px}
    .dot{width:6px;height:6px;border-radius:50%;background:#444;animation:blink 1.2s infinite;flex-shrink:0}
    .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
    .speaking-bar{display:none;align-items:center;gap:8px;padding:7px 15px;background:rgba(124,111,255,.07);border-top:1px solid rgba(124,111,255,.14);font-size:12px;color:#a89fe0;flex-shrink:0}
    .speaking-bar.show{display:flex}
    .wave{display:flex;gap:2px;align-items:center;height:15px}
    .wave span{width:3px;border-radius:3px;background:var(--accent);animation:wave .8s ease-in-out infinite}
    .wave span:nth-child(1){height:5px;animation-delay:0s}
    .wave span:nth-child(2){height:11px;animation-delay:.1s}
    .wave span:nth-child(3){height:7px;animation-delay:.2s}
    .wave span:nth-child(4){height:13px;animation-delay:.3s}
    .wave span:nth-child(5){height:5px;animation-delay:.4s}
    .stop-spk{margin-left:auto;background:none;border:1px solid rgba(124,111,255,.28);border-radius:6px;color:#a89fe0;font-size:11px;padding:3px 9px;cursor:pointer}
    .input-bar{display:flex;gap:7px;padding:9px 13px calc(var(--safe-bot)+9px);border-top:1px solid var(--border);background:#0d0d14;flex-shrink:0;align-items:center}
    .mic-btn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
    .mic-btn.recording{background:rgba(255,70,70,.12);border-color:var(--red);animation:pulse 1s infinite}
    .text-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-size:14px;color:var(--text);outline:none;font-family:'Noto Sans KR',sans-serif;-webkit-appearance:none;min-width:0}
    .text-input::placeholder{color:#484848}
    .send-btn{width:44px;height:44px;background:var(--accent);border:none;border-radius:12px;font-size:20px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
    .send-btn:disabled{opacity:.33;cursor:not-allowed}

    @keyframes blink{0%,100%{opacity:.18}50%{opacity:1}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,70,70,.32)}50%{box-shadow:0 0 0 8px rgba(255,70,70,0)}}
    @keyframes wave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.75)}}
  </style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div id="home" class="screen active">
  <div class="streak-badge">🔥 <span id="streak-num">3</span>일 연속 학습 중</div>
  <div class="logo">
    <span class="logo-main">daily</span>
    <span class="logo-sub">ENGLISH</span>
  </div>
  <p class="tagline">AI 튜터와 실전 영어 회화 • 🎤 음성 대화</p>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-val">7일</div><div class="stat-lbl">이번 주</div></div>
    <div class="stat-box"><div class="stat-val">42문장</div><div class="stat-lbl">총 발화</div></div>
    <div class="stat-box"><div class="stat-val">A2→B1</div><div class="stat-lbl">레벨업</div></div>
  </div>
  <button class="primary-btn" onclick="goSetup()">오늘 학습 시작하기 →</button>
  <p class="hint">매일 10분 • 음성 입력 + AI 피드백</p>
</div>

<!-- SETUP -->
<div id="setup" class="screen">
  <button class="back-btn" onclick="goHome()">← 뒤로</button>
  <h2 class="setup-title">오늘 뭘 연습할까요?</h2>
  <p class="sec-label">주제 선택</p>
  <div class="topic-grid" id="topic-grid"></div>
  <p class="sec-label">레벨 선택</p>
  <div class="level-row" id="level-row"></div>
  <button class="primary-btn" id="start-btn" onclick="startChat()" disabled>대화 시작하기 ✨</button>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
  <div class="chat-header">
    <button class="back-btn" onclick="stopAll();goSetup()">←</button>
    <div>
      <div class="chat-title" id="chat-title">—</div>
      <div class="chat-sub" id="chat-sub">—</div>
    </div>
    <div class="hdr-right">
      <button class="icon-btn on" id="tts-toggle" onclick="toggleTTS()">🔊</button>
      <div class="live-tag">LIVE</div>
    </div>
  </div>
  <div class="msg-list" id="msg-list"></div>
  <div class="speaking-bar" id="speaking-bar">
    <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
    <span>AI 튜터가 읽는 중...</span>
    <button class="stop-spk" onclick="stopSpeech()">■ 정지</button>
  </div>
  <div class="input-bar">
    <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
    <input class="text-input" id="chat-input" placeholder="🎤 누르거나 직접 입력하세요"/>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>↑</button>
  </div>
</div>

</div>
<script>
const TOPICS=[
  {id:"daily",   emoji:"☕",label:"일상 대화",  prompt:"Everyday small talk — greetings, weather, weekend plans, casual chat."},
  {id:"travel",  emoji:"✈️",label:"여행",        prompt:"Travel English — hotel check-in, ordering food, asking for directions, airport."},
  {id:"work",    emoji:"💼",label:"비즈니스",    prompt:"Business English — meetings, professional emails, presentations, workplace."},
  {id:"shopping",emoji:"🛍️",label:"쇼핑",        prompt:"Shopping English — products, prices, sizes, making purchases, returns."},
  {id:"health",  emoji:"🏥",label:"병원/건강",   prompt:"Medical English — symptoms, doctor visits, pharmacy conversations."},
  {id:"social",  emoji:"🎉",label:"소셜 상황",   prompt:"Social English — parties, introductions, making friends, gatherings."},
];
const LEVELS=[
  {id:"beginner",    label:"초급",desc:"Simple words"},
  {id:"intermediate",label:"중급",desc:"Natural expressions"},
  {id:"advanced",    label:"고급",desc:"Native fluency"},
];
let selTopic=null,selLevel="intermediate",chatHistory=[],isLoading=false,ttsEnabled=true;
let recognition=null,isRecording=false;

// Setup UI
TOPICS.forEach(t=>{
  const btn=document.createElement('button');btn.className='topic-btn';
  btn.innerHTML=`<span class="topic-emoji">${t.emoji}</span><span class="topic-label">${t.label}</span>`;
  btn.onclick=()=>{document.querySelectorAll('.topic-btn').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');selTopic=t;document.getElementById('start-btn').disabled=false;};
  document.getElementById('topic-grid').appendChild(btn);
});
LEVELS.forEach(l=>{
  const btn=document.createElement('button');btn.className='level-btn'+(l.id===selLevel?' sel':'');
  btn.innerHTML=`<div class="level-name">${l.label}</div><div class="level-desc">${l.desc}</div>`;
  btn.onclick=()=>{document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');selLevel=l.id;};
  document.getElementById('level-row').appendChild(btn);
});

if('serviceWorker' in navigator){
  const sw=`const C='de-v4';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(['./']))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))).catch(()=>{});
}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goHome(){show('home');}function goSetup(){show('setup');}

// TTS
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.addEventListener('voiceschanged',()=>speechSynthesis.getVoices());}
function getBestVoice(){
  const vv=speechSynthesis.getVoices();
  const pref=['Samantha','Alex','Karen','Google US English','Microsoft Aria'];
  for(const n of pref){const v=vv.find(v=>v.name.includes(n));if(v)return v;}
  return vv.find(v=>v.lang==='en-US')||vv.find(v=>v.lang.startsWith('en'))||null;
}
function speak(text){
  if(!ttsEnabled||!('speechSynthesis' in window))return;
  stopSpeech();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=selLevel==='beginner'?0.78:selLevel==='advanced'?1.05:0.92;u.pitch=1.05;
  const v=getBestVoice();if(v)u.voice=v;
  u.onstart=()=>document.getElementById('speaking-bar').classList.add('show');
  u.onend=u.onerror=()=>document.getElementById('speaking-bar').classList.remove('show');
  setTimeout(()=>speechSynthesis.speak(u),80);
}
function stopSpeech(){if('speechSynthesis' in window)speechSynthesis.cancel();document.getElementById('speaking-bar').classList.remove('show');}
function toggleTTS(){ttsEnabled=!ttsEnabled;const b=document.getElementById('tts-toggle');b.textContent=ttsEnabled?'🔊':'🔇';b.classList.toggle('on',ttsEnabled);if(!ttsEnabled)stopSpeech();}

// STT — Web Speech API (works on HTTPS)
const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
const micBtn=document.getElementById('mic-btn');
if(!SpeechRec){micBtn.disabled=true;micBtn.title='Chrome/Safari에서만 지원돼요';}

function toggleMic(){if(!SpeechRec)return;isRecording?stopMic():startMic();}
function startMic(){
  stopSpeech();
  recognition=new SpeechRec();
  recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=true;
  const input=document.getElementById('chat-input');
  let final='';
  recognition.onstart=()=>{isRecording=true;micBtn.classList.add('recording');micBtn.textContent='⏹';input.placeholder='🎙 듣는 중... 영어로 말해보세요';};
  recognition.onresult=e=>{
    let interim='';final='';
    for(let i=0;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript;else interim+=e.results[i][0].transcript;}
    input.value=(final||interim).trim();
    document.getElementById('send-btn').disabled=!input.value.trim();
  };
  recognition.onend=()=>{
    isRecording=false;micBtn.classList.remove('recording');micBtn.textContent='🎤';input.placeholder='🎤 누르거나 직접 입력하세요';
    if(final.trim())sendMessage();
  };
  recognition.onerror=e=>{
    isRecording=false;micBtn.classList.remove('recording');micBtn.textContent='🎤';
    if(e.error==='not-allowed')alert('🎤 마이크 권한을 허용해주세요.\n브라우저 주소창 자물쇠 아이콘 → 마이크 허용');
  };
  try{recognition.start();}catch(e){}
}
function stopMic(){if(recognition){try{recognition.stop();}catch(e){}recognition=null;}isRecording=false;micBtn.classList.remove('recording');micBtn.textContent='🎤';}
function stopAll(){stopMic();stopSpeech();}

// Input
const chatInput=document.getElementById('chat-input');
const sendBtn=document.getElementById('send-btn');
chatInput.addEventListener('input',()=>{sendBtn.disabled=!chatInput.value.trim()||isLoading;});
chatInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});

// AI
function sysPrompt(){
  const lvl=LEVELS.find(l=>l.id===selLevel).label;
  return `You are an enthusiastic, warm English conversation tutor helping a Korean learner practice SPOKEN English.
Topic: ${selTopic.prompt}
Student level: ${lvl}
Rules:
1. Reply naturally in English — 2-3 sentences, easy to listen to.
2. After your reply add "💡 피드백:" in Korean with: key phrase translation, pronunciation/grammar tip, encouraging follow-up question.
3. Match vocabulary to student level. Be warm and encouraging.
4. If student speaks Korean, give a simple English starter phrase.
Format EXACTLY:
[English response]

💡 피드백:
[Korean tip + follow-up]`;
}
function parseMsg(text){const idx=text.indexOf('💡 피드백:');if(idx===-1)return{english:text.trim(),feedback:null};return{english:text.slice(0,idx).trim(),feedback:text.slice(idx+8).trim()};}
const msgList=document.getElementById('msg-list');
function appendMsg(role,text){
  if(role==='assistant'){
    const{english,feedback}=parseMsg(text);
    const group=document.createElement('div');group.className='msg-group';
    const row=document.createElement('div');row.className='avatar-row';
    const av=document.createElement('div');av.className='avatar';av.textContent='AI';
    const bub=document.createElement('div');bub.className='bubble';bub.textContent=english;bub.onclick=()=>speak(english);
    row.append(av,bub);group.appendChild(row);
    const hint=document.createElement('div');hint.className='replay-hint';hint.textContent='🔊 탭하면 다시 들을 수 있어요';group.appendChild(hint);
    if(feedback){const fb=document.createElement('div');fb.className='feedback-box';fb.innerHTML=`<span class="fb-icon">💡</span><span class="fb-text">${feedback}</span>`;group.appendChild(fb);}
    msgList.appendChild(group);speak(english);
  }else{
    const wrap=document.createElement('div');wrap.className='user-bubble-wrap';
    const bub=document.createElement('div');bub.className='user-bubble';bub.textContent=text;
    wrap.appendChild(bub);msgList.appendChild(wrap);
  }
  setTimeout(()=>msgList.scrollTo({top:msgList.scrollHeight,behavior:'smooth'}),50);
}
function showTyping(){const row=document.createElement('div');row.className='avatar-row';row.id='typing';const av=document.createElement('div');av.className='avatar';av.textContent='AI';const bub=document.createElement('div');bub.className='bubble typing-bubble';bub.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';row.append(av,bub);msgList.appendChild(row);msgList.scrollTop=msgList.scrollHeight;}
function hideTyping(){document.getElementById('typing')?.remove();}
async function callAI(userMsg){
  chatHistory.push({role:'user',content:userMsg});
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,system:sysPrompt(),messages:chatHistory})});
  const data=await res.json();
  const reply=data.content?.[0]?.text||'Great! Keep going! 😊';
  chatHistory.push({role:'assistant',content:reply});return reply;
}
async function startChat(){
  show('chat');
  document.getElementById('chat-title').textContent=`${selTopic.emoji} ${selTopic.label}`;
  document.getElementById('chat-sub').textContent=`${LEVELS.find(l=>l.id===selLevel).label} · AI 튜터`;
  msgList.innerHTML='';chatHistory=[];isLoading=true;sendBtn.disabled=true;showTyping();
  try{const r=await callAI(`Start our spoken English conversation. Give a warm, short opening line for a ${selLevel} learner.`);hideTyping();appendMsg('assistant',r);}
  catch{hideTyping();appendMsg('assistant','Hello! How are you doing today? 😊\n\n💡 피드백:\n"How are you doing?"는 "어떻게 지내요?"예요.\n🎤 버튼을 눌러 영어로 말해보세요!');}
  isLoading=false;
}
async function sendMessage(){
  const text=chatInput.value.trim();if(!text||isLoading)return;
  stopAll();chatInput.value='';sendBtn.disabled=true;appendMsg('user',text);isLoading=true;showTyping();
  try{const r=await callAI(text);hideTyping();appendMsg('assistant',r);}
  catch{hideTyping();appendMsg('assistant','Sorry, connection issue! Let\'s try again. 😊\n\n💡 피드백:\n연결 오류가 생겼어요. 다시 시도해볼까요?');}
  isLoading=false;sendBtn.disabled=!chatInput.value.trim();
}
</script>
